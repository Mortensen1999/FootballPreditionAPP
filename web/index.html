<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchday Predictor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322c55e'/%3E%3Cpath d='M16 9l6 4-2 7h-8l-2-7z' fill='%230b1210'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><path d="M16 9l6 4-2 7h-8l-2-7z"/></svg>
        </span>
        <span>Matchday <b>Predictor</b></span>
      </a>

      <nav class="nav">
        <a href="#/dashboard" data-page="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>
          Dashboard
        </a>
        <a href="#/matches" data-page="matches">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>
          Matches
        </a>
        <a href="#/predictions" data-page="predictions">
          <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          Predictions
        </a>
        <a href="#/bets" data-page="bets">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>
          Bet tracker
        </a>
        <a href="#/models" data-page="models">
          <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
          Models &amp; data
        </a>
        <a href="#/settings" data-page="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-foot">v0.1 · demo data</div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-right">
          <span class="chip"><span class="dot dot-warn"></span>Model not connected</span>
          <span class="chip chip-strong" id="bankrollChip"></span>
        </div>
      </header>

      <div class="demo-banner">
        Showing demo data. The numbers are placeholders until a prediction model and data sources are connected.
      </div>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
